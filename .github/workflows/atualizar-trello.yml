name: Atualizar dados do Trello

on:
  schedule:
    # Horário de trabalho (seg-sáb, ~07h às 19h30 em Brasília = UTC-3): a cada 30 min
    - cron: "7,37 10-22 * * 1-6"
    # Demais horários: a cada 3 horas
    - cron: "23 */3 * * *"
  workflow_dispatch:         # botão "Run workflow" para atualizar na hora

permissions:
  contents: write

concurrency:
  group: atualizar-trello
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Baixar cards do Trello e gerar dados.csv
        env:
          TRELLO_KEY: ${{ secrets.TRELLO_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          TRELLO_BOARD_ID: ${{ secrets.TRELLO_BOARD_ID }}
        run: python scripts/trello_to_csv.py
      - name: Publicar se houve mudança
        run: |
          if [ -z "$(git status --porcelain -- 'dados*.csv')" ]; then echo "Sem mudanças"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados*.csv
          git commit -m "Atualiza dados do Trello ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push
